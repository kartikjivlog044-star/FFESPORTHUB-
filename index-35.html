unt name, email, Free Fire UID, tournament bookings, results, wallet information and payout-request details in Firebase for operating the service.</p><h3>Advertising & Cookies</h3><p>If Google advertising products are enabled, advertising cookies or similar technologies may be used for ad delivery, measurement and personalization where permitted. Applicable privacy and consent choices will be provided where required.</p><h3>Third-Party Services</h3><p>Firebase and advertising or analytics providers may process information necessary to provide their services. Their respective privacy terms may also apply.</p><h3>Account Deletion</h3><p>Registered users can submit an account deletion request from their account settings. Some records may be retained when required for security, fraud prevention, financial records or legal obligations.</p></div></section><section class="public-section" id="terms"><div class="section-head"><h2>Terms & Responsible Play</h2></div><div class="card policy-full"><p>Users must provide accurate account information, follow tournament rules, avoid cheating or abusive behavior and respect published results. FF eSPORTS HUB is designed for free-entry esports tournaments and responsible participation.</p><p>Do not share passwords, authentication codes or sensitive financial credentials with other users. Tournament and payout decisions are subject to the published rules and applicable requirements.</p></div></section><section class="public-section" id="contact"><div class="section-head"><h2>About & Contact</h2></div><div class="public-grid"><article class="card"><h3>About FF eSPORTS HUB</h3><p>FF eSPORTS HUB is a Free Fire esports tournament platform focused on scheduled free-entry matches, group management, room controls, leaderboards and admin-managed prize payouts.</p></article><article class="card"><h3>Support</h3><p>For account, tournament, privacy, payout or deletion requests, contact:</p><p><a class="link" href="mailto:kartikjivlog044@gmail.com" function policies(){return shell("Rules & Policies",`<div class="hero"><div class="eyebrow">FF eSPORTS HUB • INFORMATION</div><h1>Terms, Rules & Privacy</h1><p>Users can read the complete tournament rules and service information before registering or joining a contest.</p></div><div class="card policy-full"><h2>Terms & Conditions</h2><h3>1. Free Entry</h3><p>All listed tournaments are free-entry contests unless a page explicitly states otherwise. Users are not asked to deposit money to join.</p><h3>2. Registration</h3><p>Users must provide accurate account details and their Free Fire UID. One account should not be used to impersonate another player.</p><h3>3. Tournament Groups</h3><p>Players are assigned to groups of up to 50. Group start times are separated by five minutes.</p><h3>4. Room ID & Password</h3><p>Room credentials are controlled by the admin. Published credentials remain hidden until the scheduled release window, normally 10 minutes before that group's start.</p><h3>5. Fair Play</h3><p>Cheats, hacks, exploits, collusion, teaming where prohibited, abuse of bugs and false information are prohibited. Results can be reviewed under the published tournament rules.</p><h3>6. Results & Leaderboard</h3><p>Admin enters verified match results including player name, kills and placement. The leaderboard becomes visible to users only when the admin publishes the results.</p><h3>7. Prizes & Payouts</h3><p>Prize information is the amount and conditions published for the tournament. Payout requests are processed by the admin according to the displayed payout rules and applicable requirements.</p><h3>8. Account Deletion</h3><p>Logged-in users can submit an account deletion request from Settings. Some records may need to be retained where required for security, fraud prevention, financial records or legal obligations.</p><h2 style="margin-top:25px">Privacy Policy</h2><h3>Information We Store</h3><p>We may store account name, email, Free Fire UID, tournament bookings, results, wallet and payout-request information in Firebase to operate the service.</p><h3>Advertising & Cookies</h3><p>If Google advertising products are enabled, cookies and similar technologies may be used for ad delivery, measurement and personalization where permitted. Users will be provided applicable privacy/consent choices.</p><h3>Third-Party Services</h3><p>Firebase and advertising/analytics providers may process information necessary to provide their services. Their own policies also apply.</p><h3>Contact & Data Requests</h3><p>For account deletion or privacy requests, use the in-app account deletion request or the support contact published by FF eSPORTS HUB.</p><h2 style="margin-top:25px">Responsible Play / Prize Information</h2><p>FF eSPORTS HUB is a free-entry tournament platform. Users should participate fairly, follow game rules and never provide passwords or sensitive financial credentials in chat or tournament forms.</p></div>`)}

function resultPoints(kills,placement){const k=Math.max(0,Number(kills||0));const p=Math.max(1,Number(placement||999));const placementMap={1:15,2:12,3:10,4:8,5:6,6:5,7:4,8:3,9:2,10:1};return k+(placementMap[p]||0)}
function sortedResults(t){return (Array.isArray(t.results)?t.results:[]).map((r,i)=>({...r,_i:i})).sort((a,b)=>Number(b.points||0)-Number(a.points||0)||Number(a.placement||999)-Number(b.placement||999)||Number(b.kills||0)-Number(a.kills||0)||String(a.username||"").localeCompare(String(b.username||"")));}
function leaderboard(t){
 const rows=sortedResults(t);
 if(!t.leaderboardPublished){
  return shell("Leaderboard",`<div class="leader-hero"><div class="eyebrow">🏆 TOURNAMENT LEADERBOARD</div><h1>${esc(t.name)}</h1><p>Results are currently private. Admin will publish the verified leaderboard after the match.</p><div class="card" style="margin-top:12px"><div style="font-size:40px">🔒</div><h3>Results Not Published</h3><div class="tiny">Please check again after the admin publishes the final results.</div></div></div>`);
 }
 const top=rows.slice(0,3);
 const order=[top[1],top[0],top[2]];
 const medals=["🥈","🥇","🥉"];
 const podium=top.length?`<div class="podium">${order.map((r,i)=>r?`<div class="podium-card ${i===1?"first":""}"><div class="podium-medal">${medals[i]}</div><div class="podium-rank">${i===1?"CHAMPION":"TOP 3"}</div><div class="leader-name">${esc(r.username||"Player")}</div><div class="leader-points">${Number(r.points||0)} PTS</div><div class="leader-kills">💥 ${Number(r.kills||0)} KILLS • ${Number(r.placement||0)} ${Number(r.placement||0)===1?"ST":"PLACE"}</div></div>`:`<div class="podium-card"><div class="podium-rank">—</div><div class="tiny">Waiting for result</div></div>`).join("")}</div>`:`<div class="tiny">No results yet.</div>`;
 const table=rows.map((r,i)=>`<div class="leader-row"><div class="leader-rank">${i<3?["🥇","🥈","🥉"][i]:i+1}</div><div><div class="leader-name">${esc(r.username||"Player")}</div><small class="tiny">${esc(r.group||"")}</small></div><div class="leader-stat">${Number(r.kills||0)}</div><div class="leader-stat">${Number(r.points||0)}</div></div>`).join("")||`<div class="card empty">No results published yet.</div>`;
 return shell("Leaderboard",`<div class="leader-wrap"><div class="leader-hero"><div class="eyebrow">🏆 ${normalizeTournamentStatus(t.status)==="Live"?"LIVE":"FINAL"} LEADERBOARD</div><h1>${esc(t.name)}</h1><p>${rows.length} results • Kills + placement points • Updated live from Firebase</p>${podium}</div><div class="leader-table"><div class="leader-row head"><div>RANK</div><div>PLAYER</div><div>KILLS</div><div>POINTS</div></div>${table}</div><button class="btn secondary block" style="margin-top:10px" data-screen="tournaments">Back to Tournaments</button></div>`);
}
function adminResults(){return `<div>${S.tournaments.map(t=>{const rows=sortedResults(t);return `<div class="card" style="margin-bottom:11px"><div class="mini-row"><div><h3 style="margin:0">${esc(t.name)}</h3><div class="tiny">${rows.length} results • ${t.leaderboardPublished?"Published to users":"Private"}</div></div><button class="btn secondary" style="width:auto;padding:8px" data-leaderboard="${t.id}">Preview</button></div><div class="publish-result"><div><b><span class="status-dot ${t.leaderboardPublished?"on":""}"></span> ${t.leaderboardPublished?"Leaderboard Published":"Leaderboard Private"}</b><div class="tiny">Users can only see verified results when published.</div></div><button class="btn ${t.leaderboardPublished?"red":"green"}" style="width:auto;padding:8px" data-publish-results="${t.id}">${t.leaderboardPublished?"Make Private":"Publish Results"}</button></div><form class="result-form" data-result-form="${t.id}"><div class="result-form-grid"><div><label>PLAYER / GAMER TAG</label><input name="username" placeholder="ShadowX" required></div><div><label>UID (OPTIONAL)</label><input name="uid" placeholder="FF-12345"></div><div><label>KILLS</label><input name="kills" type="number" min="0" value="0" required></div><div><label>PLACEMENT</label><input name="placement" type="number" min="1" value="1" required></div><div><label>GROUP</label><input name="group" placeholder="A"></div></div><div class="result-actions"><button class="btn block">＋ Add Result</button></div></form>${rows.map((r,i)=>`<div class="admin-result-card"><div class="mini-row"><div><span class="tag">#${i+1}</span> <b>${esc(r.username||"Player")}</b></div><span><b>${Number(r.points||0)} pts</b> • ${Number(r.kills||0)} kills • ${Number(r.placement||0)} place</span></div><div class="tiny">${esc(r.uid||"")} ${r.group?"• "+esc(r.group):""}</div><div class="result-actions"><button class="btn secondary" data-edit-result="${t.id}" data-result-index="${r._i}">Edit Result</button><button class="btn red" data-delete-result="${t.id}" data-result-index="${r._i}">Delete</button></div></div>`).join("")||`<div class="tiny" style="margin-top:10px">No results yet. Add the players after the match.</div>`}</div>`}).join("")||`<div class="card empty">Create a tournament first.</div>`}</div>`}

function admin(){if(!S.admin)return shell("Admin Panel",`<div class="card" style="max-width:430px;margin:auto"><div class="eyebrow">FIREBASE ADMIN</div><h2>Admin access</h2><p class="tiny">Login with a Firebase account whose Firestore user document has <b>role: admin</b>. Do not rely on a client-only PIN for production security.</p><button class="btn block" data-screen="profile">Go to account</button></div>`);const pending=S.withdrawals.filter(x=>x.status==="Pending");return shell("Admin Panel",`<div class="hero"><div class="eyebrow">ADMIN CONTROL ROOM • FIREBASE</div><h1>Manage FF eSPORTS HUB</h1><p>Create, edit and delete tournaments. Set Room ID/Password per group and choose <b>Publish</b> or <b>Private</b>. Published credentials remain hidden from users until the 10-minute release time.</p></div><div class="grid g4" style="margin-top:11px"><div class="admin-stat"><b>${S.tournaments.length}</b><span>Tournaments</span></div><div class="admin-stat"><b>${S.bookings.length}</b><span>My Loaded Bookings</span></div><div class="admin-stat"><b>${pending.length}</b><span>Pending Payouts</span></div><div class="admin-stat"><b>${money(S.tournaments.reduce((a,x)=>a+Number(x.prizePool??x.prize??0),0))}</b><span>Prize Pools</span></div></div><div class="admin-tabs" style="margin:13px 0"><button class="${adminTab==="overview"?"active":""}" data-atab="overview">Overview</button><button class="${adminTab==="create"?"active":""}" data-atab="create">+ Create</button><button class="${adminTab==="rooms"?"active":""}" data-atab="rooms">Room Control</button><button class="${adminTab==="withdrawals"?"active":""}" data-atab="withdrawals">Withdrawals</button><button class="${adminTab==="results"?"active":""}" data-atab="results">🏆 Results</button><button class="${adminTab==="users"?"active":""}" data-atab="users">Users</button></div>${adminTab==="create"?adminCreate():adminTab==="rooms"?adminRooms():adminTab==="withdrawals"?adminWithdrawals():adminTab==="results"?adminResults():adminTab==="users"?adminUsers():adminOverview()}`)}
function adminOverview(){return `<div class="grid g2"><div class="card"><h3>Quick Actions</h3><button class="btn block" data-atab="create">＋ Create Tournament</button><button class="btn secondary block" style="margin-top:7px" data-atab="rooms">▣ Room Control</button><button class="btn secondary block" style="margin-top:7px" data-atab="results">🏆 Leaderboard / Results</button><button class="btn secondary block" style="margin-top:7px" data-atab="withdrawals">₹ Withdrawals</button></div><div class="card"><h3>Current Tournaments</h3>${S.tournaments.map(t=>`<div class="list-row"><div class="grow"><b>${esc(t.name)}</b><div class="tiny">${esc(t.date)} • ${esc(t.time)} • ${Number(t.joined||0)}/${Number(t.totalSlots||t.total||0)}</div></div><span class="tag">${esc(normalizeTournamentStatus(t.status))}</span><button class="btn secondary" style="width:auto;padding:7px" data-edit="${t.id}">Edit</button><button class="btn red" style="width:auto;padding:7px" data-delete-t="${t.id}">Delete</button></div>`).join("")||`<div class="empty">No tournaments.</div>`}</div></div>`}
function adminCreate(){return `<div class="card"><div class="eyebrow">CREATE NEW MATCH</div><h2>Tournament Creator</h2><p class="tiny">Groups are generated in blocks of 50. Group B starts 5 minutes after Group A, Group C 5 minutes after B, etc.</p><form id="create"><div class="field"><label>MATCH / TOURNAMENT NAME</label><input name="name" placeholder="Weekend Rush - Free Entry" required></div><div class="form-grid"><div class="field"><label>DATE</label><input name="date" type="date" required></div><div class="field"><label>START TIME</label><input name="time" type="time" value="19:00" required></div><div class="field"><label>PRIZE POOL (₹)</label><input name="prizePool" type="number" min="0" value="50" required></div><div class="field"><label>TOTAL SLOTS</label><input name="totalSlots" type="number" min="50" step="50" value="200" required></div></div><div class="field"><label>TOURNAMENT STATUS</label><select name="status"><option>Upcoming</option><option>Live</option></select></div><button class="btn block">Create Tournament & Generate Groups</button></form></div>`}
function adminRooms(){return `<div class="grid g2">${S.tournaments.map(t=>`<div class="card"><h3>${esc(t.name)}</h3>${groups(t).map((g,i)=>`<div class="schedule-card" style="margin-top:7px"><div class="mini-row"><b>Group ${g.letter}</b><span>${fmt(g.start)}</span></div><div class="tiny">Release ${fmt(g.release)} • ${g.published?"PUBLISHED":"PRIVATE"}</div><div class="room-box"><div class="room-field"><small>ROOM ID</small><b>${g.room?esc(g.room):"Not set"}</b></div><div class="room-field"><small>PASSWORD</small><b>${g.pass?"••••••":"Not set"}</b></div></div><button class="btn secondary block" style="margin-top:7px" data-setroom="${t.id}" data-group="${i}">Edit Room / Password</button><button class="btn ${g.published?"red":"green"} block" style="margin-top:7px" data-publish="${t.id}" data-group="${i}">${g.published?"Make Private":"Publish to Users"}</button></div>`).join("")}</div>`).join("")||`<div class="card empty">No tournaments.</div>`}</div>`}
function adminWithdrawals(){return `<div class="card"><h3>Pending Withdrawals</h3>${S.withdrawals.length?S.withdrawals.map(w=>`<div class="list-row"><div class="grow"><b>${money(w.amount)} • ${esc(w.method)}</b><div class="tiny">${esc(w.detail)} • ${esc(w.status)}</div></div>${w.status==="Pending"?`<button class="btn green" style="width:auto;padding:8px" data-pay="${w.id}">Mark Paid</button>`:`<span class="tag ${w.status==="Paid"?"green":""}">${esc(w.status)}</span>`}</div>`).join(""):`<div class="empty">No withdrawal requests.</div>`}</div>`}
function adminUsers(){return `<div class="card"><h3>Users</h3><div class="tiny">User profiles are stored in <code>users/{uid}</code> in Firestore. Role must be set to <b>admin</b> for admin access.</div></div>`}

function render(){const app=document.getElementById("app");if(!app)return;if(!S.session){app.innerHTML=publicMode?publicLanding():authView();return}if(screen==="leaderboard"&&!selected){screen="tournaments";selected=null}if((screen==="join"||screen==="room"||screen==="booked")&&!selected){screen="tournaments";selected=null}let b=screen==="home"?home():screen==="tournaments"?tournaments():screen==="join"?joinView(selected):screen==="booked"?bookedView(selected,groups(selected)[selectedGroup]):screen==="my"?my():screen==="room"?roomView(selected,groups(selected)[selectedGroup]):screen==="leaderboard"?leaderboard(selected):screen==="wallet"?wallet():screen==="profile"?profile():screen==="policies"?policies():screen==="settings"?settings():screen==="notifications"?notifications():screen==="contact"?contact():screen==="about"?about():screen==="deleteAccount"?deleteAccount():screen==="admin"?admin():home();app.innerHTML=b}

async function saveUserProfile(user,extra={}){const ref=doc(db,"users",user.uid),snap=await getDoc(ref);const old=snap.exists()?snap.data():{};const data={name:extra.name??old.name??user.displayName??"Player",email:user.email||old.email||"",uid:extra.uid??old.uid??"",wallet:Number(old.wallet??0),matches:Number(old.matches??0),wins:Number(old.wins??0),role:old.role??"user",updatedAt:serverTimestamp(),...(snap.exists()?{}:{createdAt:serverTimestamp()})};await setDoc(ref,data,{merge:true});return {...data,role:old.role??"user"}}

async function loadBookings(){if(!authClient.currentUser)return;const q=query(collection(db,"users",authClient.currentUser.uid,"bookings"),orderBy("joinedAt","desc"));if(unsubscribeUser)unsubscribeUser();unsubscribeUser=onSnapshot(q,s=>{S.bookings=s.docs.map(d=>({id:d.id,...d.data()}));render()})}
function listenTournaments(){if(unsubscribeT)unsubscribeT();const q=collection(db,"tournaments");unsubscribeT=onSnapshot(q,s=>{S.tournaments=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>{const aa=a.createdAt?.toMillis?a.createdAt.toMillis():0,bb=b.createdAt?.toMillis?b.createdAt.toMillis():0;return bb-aa});if(screen==="home"||screen==="tournaments"||screen==="admin"||screen==="room"||screen==="my")render()},err=>toast("Firestore read error: "+err.message))}
function listenWithdrawals(){if(unsubscribeW)unsubscribeW();if(!S.admin)return;const q=query(collection(db,"withdrawals"),orderBy("createdAt","desc"));unsubscribeW=onSnapshot(q,s=>{S.withdrawals=s.docs.map(d=>({id:d.id,...d.data()}));if(screen==="admin")render()},err=>toast("Withdrawal read error: "+err.message))}

async function registerUser(f){if(!f.get("termsAccepted"))return toast("Please accept Terms & Conditions and Privacy Policy");try{const cred=await createUserWithEmailAndPassword(authClient,f.get("email"),f.get("password"));await updateProfile(cred.user,{displayName:f.get("name")});const data=await saveUserProfile(cred.user,{name:f.get("name"),uid:f.get("uid")});S.user=data;S.session=true;S.admin=data.role==="admin";screen="home";listenTournaments();loadBookings();listenWithdrawals();render();toast("Firebase account created")}catch(e){toast(e.message)}}
async function loginUser(f){try{const cred=await signInWithEmailAndPassword(authClient,f.get("email"),f.get("password"));const data=await saveUserProfile(cred.user);S.user=data;S.session=true;S.admin=data.role==="admin";screen="home";listenTournaments();loadBookings();listenWithdrawals();render();toast("Logged in with Firebase")}catch(e){toast(e.message)}}

async function bookSlot(){try{const t=selected;if(!authClient.currentUser)return;const gs=groups(t),idx=S.bookings.filter(x=>x.tournamentId===t.id).length%gs.length;const ref=doc(collection(db,"users",authClient.currentUser.uid,"bookings"));await setDoc(ref,{tournamentId:t.id,groupIndex:idx,groupLetter:gs[idx].letter,joinedAt:serverTimestamp()});const tref=doc(db,"tournaments",t.id);await updateDoc(tref,{joined:Number(t.joined||0)+1});selectedGroup=idx;screen="booked";render();toast("Slot booked • Group "+gs[idx].letter)}catch(e){toast("Join failed: "+e.message)}}

async function createTournament(f){const total=Number(f.get("totalSlots"));if(total<50||total%50!==0)return toast("Slots must be 50, 100, 150...");try{const ref=await addDoc(collection(db,"tournaments"),{name:f.get("name"),date:f.get("date"),time:f.get("time"),prizePool:Number(f.get("prizePool")),totalSlots:total,playersPerGroup:50,joined:0,status:f.get("status"),entryType:"FREE",overallLeaderboard:true,groups:[],createdBy:authClient.currentUser.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});const gs=[];for(let i=0;i<Math.ceil(total/50);i++){const start=dt({date:f.get("date"),time:f.get("time")},i*5);gs.push({groupId:`group${i}`,letter:String.fromCharCode(65+i),start:start.toISOString(),release:new Date(start.getTime()-600000).toISOString(),room:"",pass:"",published:false})}await updateDoc(ref,{groups:gs});adminTab="overview";render();toast("Tournament created in Firebase")}catch(e){toast("Create failed: "+e.message)}}
function editTournament(t){const body=`<div class="modal"><div class="modal-card"><h2>Edit Tournament</h2><form id="editTournament"><input type="hidden" name="id" value="${esc(t.id)}"><div class="field"><label>NAME</label><input name="name" value="${esc(t.name)}" required></div><div class="form-grid"><div class="field"><label>DATE</label><input name="date" type="date" value="${esc(t.date)}" required></div><div class="field"><label>TIME</label><input name="time" type="time" value="${esc(t.time)}" required></div><div class="field"><label>PRIZE POOL</label><input name="prizePool" type="number" min="0" value="${Number(t.prizePool??t.prize??0)}" required></div><div class="field"><label>TOTAL SLOTS</label><input name="totalSlots" type="number" min="50" step="50" value="${Number(t.totalSlots??t.total??50)}" required></div></div><div class="field"><label>STATUS</label><select name="status"><option ${normalizeTournamentStatus(t.status)==="Upcoming"?"selected":""} value="Upcoming">Upcoming</option><option ${normalizeTournamentStatus(t.status)==="Live"?"selected":""} value="Live">Live</option><option ${normalizeTournamentStatus(t.status)==="Completed"?"selected":""} value="Completed">Completed</option></select></div><button class="btn block">Save Changes</button><button type="button" class="btn secondary block" style="margin-top:7px" id="closeModal">Cancel</button></form></div></div>`;document.body.insertAdjacentHTML("beforeend",body)}
function normalizeTournamentStatus(v){const s=String(v||"").trim().toLowerCase();return s==="live"?"Live":s==="completed"?"Completed":"Upcoming"}
async function updateTournament(f){
 const id=String(f.get("id")||"").trim(),t=S.tournaments.find(x=>x.id===id);
 if(!t)return toast("Tournament not found");
 const total=Number(f.get("totalSlots"));
 if(total<50||total%50!==0)return toast("Slots must be in multiples of 50");
 const status=normalizeTournamentStatus(f.get("status"));
 try{
  const count=Math.ceil(total/50),old=Array.isArray(t.groups)?t.groups:[],gs=[];
  for(let i=0;i<count;i++){
   const start=dt({date:f.get("date"),time:f.get("time")},i*5),oldG=old[i]||{};
   gs.push({
    groupId:oldG.groupId||`group${i}`,
    letter:String.fromCharCode(65+i),
    start:start.toISOString(),
    release:new Date(start.getTime()-600000).toISOString(),
    room:oldG.room||"",
    pass:oldG.pass||"",
    published:oldG.published===true
   });
  }
  await updateDoc(doc(db,"tournaments",id),{
   name:String(f.get("name")||"").trim(),
   date:String(f.get("date")||""),
   time:String(f.get("time")||""),
   prizePool:Number(f.get("prizePool")||0),
   totalSlots:total,
   status:status,
   groups:gs,
   updatedAt:serverTimestamp()
  });
  document.querySelector(".modal")?.remove();
  toast(`Tournament status saved: ${status}`);
 }catch(e){
  toast("Status save failed: "+(e?.message||"Unknown Firebase error"));
 }
}
function uiModal({title,body,fields=[],confirmText="Confirm",danger=false,onConfirm}){
 document.querySelector(".ui-modal")?.remove();
 const wrap=document.createElement("div");wrap.className="ui-modal";wrap.innerHTML=`<div class="ui-modal-backdrop"></div><div class="ui-modal-card"><h2>${esc(title)}</h2><div class="ui-modal-body">${body||""}</div>${fields.map(f=>`<div class="field"><label>${esc(f.label)}</label><input id="modal-${esc(f.key)}" value="${esc(f.value||"")}" ${f.type?`type="${f.type}"`:""} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:""}></div>`).join("")}<div class="ui-modal-actions"><button class="btn secondary" id="modalCancel">Cancel</button><button class="btn ${danger?"red":""}" id="modalConfirm">${esc(confirmText)}</button></div></div>`;
 document.body.appendChild(wrap);
 wrap.querySelector("#modalCancel").onclick=()=>wrap.remove();wrap.querySelector(".ui-modal-backdrop").onclick=()=>wrap.remove();
 wrap.querySelector("#modalConfirm").onclick=async()=>{try{const vals={};fields.forEach(f=>vals[f.key]=wrap.querySelector(`#modal-${f.key}`)?.value||"");await onConfirm(vals);wrap.remove()}catch(e){toast(e.message||"Action failed")}};
}
async function deleteTournament(id){const t=S.tournaments.find(x=>x.id===id);if(!t)return;uiModal({title:"Delete Tournament",body:`<p>Delete <b>${esc(t.name)}</b> from Firebase? This removes the tournament document.</p>`,confirmText:"Delete",danger:true,onConfirm:async()=>{try{await deleteDoc(doc(db,"tournaments",id));toast("Tournament deleted successfully")}catch(e){toast("Delete failed: "+e.message)}}});}

async function setRoom(tid,i){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;const gs=groups(t),old=gs[i]||{};uiModal({title:`Group ${old.letter||""} Room Details`,body:`<p>Save these details privately first. Users only see them after Publish and the 10-minute release time.</p>`,fields:[{key:"room",label:"ROOM ID",value:old.room||"",placeholder:"Enter Room ID"},{key:"pass",label:"PASSWORD",value:old.pass||"",placeholder:"Enter Password"}],confirmText:"Save Changes",onConfirm:async v=>{const arr=groups(t).map(g=>({groupId:g.groupId,letter:g.letter,start:g.start.toISOString(),release:g.release.toISOString(),room:g.room,pass:g.pass,published:g.published}));arr[i].room=v.room.trim();arr[i].pass=v.pass.trim();await updateDoc(doc(db,"tournaments",tid),{groups:arr,updatedAt:serverTimestamp()});toast("Room details saved successfully")}})}
async function publishRoom(tid,i){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;const arr=groups(t).map(g=>({groupId:g.groupId,letter:g.letter,start:g.start.toISOString(),release:g.release.toISOString(),room:g.room,pass:g.pass,published:g.published}));arr[i].published=!arr[i].published;await updateDoc(doc(db,"tournaments",tid),{groups:arr,updatedAt:serverTimestamp()});toast(arr[i].published?"Room published successfully":"Room made private")}
async function saveResult(tid,form){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;const username=String(form.get("username")||"").trim();if(!username)return toast("Player name is required");const kills=Math.max(0,Number(form.get("kills")||0));const placement=Math.max(1,Number(form.get("placement")||1));const result={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),username,uid:String(form.get("uid")||"").trim(),group:String(form.get("group")||"").trim().toUpperCase(),kills,placement,points:resultPoints(kills,placement),updatedAt:new Date().toISOString()};const results=Array.isArray(t.results)?[...t.results]:[];results.push(result);try{await updateDoc(doc(db,"tournaments",tid),{results,updatedAt:serverTimestamp()});toast(`${username} result saved successfully • ${result.points} points`);form.reset()}catch(e){toast("Result save failed: "+e.message)}}
async function editResult(tid,index){const t=S.tournaments.find(x=>x.id===tid),r=t?.results?.[index];if(!r)return;uiModal({title:"Edit Leaderboard Result",fields:[{key:"username",label:"PLAYER / GAMER TAG",value:r.username||""},{key:"kills",label:"KILLS",value:String(r.kills??0),type:"number"},{key:"placement",label:"PLACEMENT",value:String(r.placement??1),type:"number"},{key:"uid",label:"UID",value:r.uid||""},{key:"group",label:"GROUP",value:r.group||""}],confirmText:"Save Changes",onConfirm:async v=>{const k=Math.max(0,Number(v.kills)||0),p=Math.max(1,Number(v.placement)||1),results=[...(t.results||[])];results[index]={...results[index],username:v.username.trim()||"Player",uid:v.uid.trim(),group:v.group.trim().toUpperCase(),kills:k,placement:p,points:resultPoints(k,p),updatedAt:new Date().toISOString()};await updateDoc(doc(db,"tournaments",tid),{results,updatedAt:serverTimestamp()});toast("Leaderboard result updated successfully")}})}
async function deleteResult(tid,index){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;const r=t.results?.[index];uiModal({title:"Delete Result",body:`<p>Delete result for <b>${esc(r?.username||"Player")}</b>?</p>`,confirmText:"Delete",danger:true,onConfirm:async()=>{const results=[...(t.results||[])];results.splice(index,1);await updateDoc(doc(db,"tournaments",tid),{results,updatedAt:serverTimestamp()});toast("Leaderboard result deleted successfully")}})}
async function publishResults(tid){const t=S.tournaments.find(x=>x.id===tid);if(!t)return;try{const next=t.leaderboardPublished!==true;await updateDoc(doc(db,"tournaments",tid),{leaderboardPublished:next,updatedAt:serverTimestamp()});toast(next?"Leaderboard published successfully":"Leaderboard made private")}catch(e){toast("Publish failed: "+e.message)}}
async function markPaid(id){const w=S.withdrawals.find(x=>x.id===id);if(!w)return;uiModal({title:"Mark Withdrawal Paid",body:`<p>Mark <b>${money(w.amount)}</b> as paid? The user's wallet will be deducted after confirmation.</p>`,confirmText:"Mark Paid",onConfirm:async()=>{try{const batch=writeBatch(db);batch.update(doc(db,"withdrawals",id),{status:"Paid",paidAt:serverTimestamp(),paidBy:authClient.currentUser.uid});const uref=doc(db,"users",w.uid);const us=await getDoc(uref);const current=Number(us.data()?.wallet||0);batch.update(uref,{wallet:Math.max(0,current-Number(w.amount||0)),updatedAt:serverTimestamp()});await batch.commit();toast("Withdrawal marked Paid successfully")}catch(e){toast("Payment update failed: "+e.message)}}})}

document.addEventListener("click",async e=>{try{
 const s=e.target.closest("[data-screen]");if(s){screen=s.dataset.screen;render();return}
 if(e.target.closest("#notifyToggle")){const on=localStorage.getItem("ff_notify")!=="off";localStorage.setItem("ff_notify",on?"off":"on");toast(on?"Notifications turned off":"Notifications turned on");render();return}
 if(e.target.closest("#languageToggle")){const next=localStorage.getItem("ff_lang")==="hi"?"en":"hi";localStorage.setItem("ff_lang",next);toast(next==="hi"?"Language preference set to Hindi":"Language preference set to English");render();return}
 if(e.target.closest("#themeToggle")){toast("Dark Gaming theme is active");return}
 if(e.target.closest("[data-public-back]")){publicMode=true;render();return}
 const at=e.target.closest("[data-auth]");if(at){authMode=at.dataset.auth;authPage="auth";publicMode=false;render();return}
 const ap=e.target.closest("[data-auth-page]");if(ap){authPage=ap.dataset.authPage;render();return}
 const j=e.target.closest("[data-join]");if(j){selected=S.tournaments.find(t=>t.id===j.dataset.join);screen="join";render();return}
 if(e.target.id==="continueJoin"){const cb=document.getElementById("joinRulesAgree");if(!cb?.checked){toast("Please read and accept the tournament rules first");return}await bookSlot();return}
 if(e.target.id==="logout"){publicMode=true;await signOut(authClient);return}
 const r=e.target.closest("[data-room]");if(r){selected=S.tournaments.find(t=>t.id===r.dataset.room);selectedGroup=Number(r.dataset.group);screen="room";render();return}
 const tab=e.target.closest("[data-atab]");if(tab){adminTab=tab.dataset.atab;render();return}
 if(e.target.id==="delete"){uiModal({title:"Request Account Deletion",body:`<p>Your request will be saved in Firebase for admin processing.</p>`,confirmText:"Submit Request",danger:true,onConfirm:async()=>{await updateDoc(doc(db,"users",authClient.currentUser.uid),{accountStatus:"Deletion Requested",deleteRequestAt:serverTimestamp()});toast("Deletion request submitted successfully")}});return}
 const ed=e.target.closest("[data-edit]");if(ed){const t=S.tournaments.find(x=>x.id===ed.dataset.edit);if(t)editTournament(t);return}
 const del=e.target.closest("[data-delete-t]");if(del){await deleteTournament(del.dataset.deleteT);return}
 const sr=e.target.closest("[data-setroom]");if(sr){await setRoom(sr.dataset.setroom,Number(sr.dataset.group));return}
 const pub=e.target.closest("[data-publish]");if(pub){await publishRoom(pub.dataset.publish,Number(pub.dataset.group));return}
 const lb=e.target.closest("[data-leaderboard]");if(lb){selected=S.tournaments.find(t=>t.id===lb.dataset.leaderboard)||null;screen="leaderboard";render();return}
 const pr=e.target.closest("[data-publish-results]");if(pr){await publishResults(pr.dataset.publishResults);return}
 const er=e.target.closest("[data-edit-result]");if(er){await editResult(er.dataset.editResult,Number(er.dataset.resultIndex));return}
 const dr=e.target.closest("[data-delete-result]");if(dr){await deleteResult(dr.dataset.deleteResult,Number(dr.dataset.resultIndex));return}
 const pay=e.target.closest("[data-pay]");if(pay){await markPaid(pay.dataset.pay);return}
 if(e.target.id==="closeModal"){document.querySelector(".modal")?.remove();return}
}catch(err){toast(err.message||"Something went wrong")}});

document.addEventListener("change",e=>{if(e.target.id==="joinRulesAgree"){const b=document.getElementById("continueJoin");if(b)b.disabled=!e.target.checked;}});

document.addEventListener("submit",async e=>{e.preventDefault();const f=new FormData(e.target);try{if(e.target.id==="authForm"){if(authMode==="register")await registerUser(f);else await loginUser(f);return}if(e.target.id==="withdraw"){const a=Number(f.get("amount"));if(a<200)return toast("Minimum withdrawal is ₹200");if(a>Number(S.user?.wallet||0))return toast("Insufficient wallet balance");await addDoc(collection(db,"withdrawals"),{uid:authClient.currentUser.uid,userEmail:authClient.currentUser.email,amount:a,method:f.get("method"),detail:f.get("detail"),status:"Pending",createdAt:serverTimestamp()});toast("Withdrawal request sent successfully");return}if(e.target.id==="create"){await createTournament(f);return}if(e.target.id==="editTournament"){await updateTournament(f);return}const rf=e.target.closest("[data-result-form]");if(rf){await saveResult(rf.dataset.resultForm,f);return}}catch(err){toast(err.message||"Action failed")}});

onAuthStateChanged(authClient,async user=>{if(user){try{S.user=await saveUserProfile(user);S.session=true;S.admin=S.user.role==="admin";authPage="auth";listenTournaments();loadBookings();listenWithdrawals();render()}catch(e){toast("Firebase profile error: "+e.message)}}else{S={user:null,tournaments:[],bookings:[],withdrawals:[],transactions:[],admin:false,session:false};publicMode=true;if(unsubscribeT)unsubscribeT();if(unsubscribeUser)unsubscribeUser();if(unsubscribeW)unsubscribeW();render()}});

async function boot(){
 const app=document.getElementById("app");
 if(!app)return;
 app.innerHTML=splash();
 setTimeout(()=>{document.getElementById("splash")?.classList.add("out")},900);
 setTimeout(()=>{
   document.getElementById("splash")?.remove();
   if(!app.innerHTML.trim()) render();
 },1300);
}
document.addEventListener("DOMContentLoaded",boot);
</script>
</body>
</html>
